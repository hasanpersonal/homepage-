<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Right Edit / Settings Button -->
    <button id="editBtn" class="edit-btn" title="Settings"><i class="fas fa-cog"></i></button>

    <div class="main-container">
        <!-- Header Text -->
        <h1 id="headerText" class="header-text">Welcome Back</h1>

        <!-- Google Search Form -->
        <form id="searchForm" class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search Google..." autocomplete="off">
        </form>

        <!-- Apps/Websites Grid -->
        <div id="appsGrid" class="apps-grid">
            <!-- Apps will be loaded here automatically by script.js -->
        </div>

        <!-- Anime Release Schedule -->
        <div class="anime-container glass-panel">
            <h2><i class="fas fa-tv"></i> Release Dates</h2>
            <div id="animeList" class="anime-list">
                <p>Loading schedule...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Homepage by Hasan | Project 2026</p>
    </footer>

    <!-- Settings Modal (Hidden by default) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass-panel">
            <span id="closeModal" class="close">&times;</span>
            <h2><i class="fas fa-sliders-h"></i> Settings</h2>
            
            <!-- Edit Header Section -->
            <div class="settings-section">
                <label>Change Header Text:</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="editHeaderText" placeholder="Enter new header">
                    <button id="saveHeaderBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                </div>
            </div>

            <!-- Add New Website Section -->
            <div class="settings-section">
                <label>Add New Website:</label>
                <input type="text" id="newAppName" placeholder="Website Name (e.g., YouTube)">
                <input type="url" id="newAppUrl" placeholder="Website URL (e.g., https://youtube.com)">
                <button id="addAppBtn" class="btn"><i class="fas fa-plus"></i> Add Website</button>
            </div>

            <!-- Manage Websites Section -->
            <div class="settings-section">
                <label>Manage Websites (Reorder & Delete):</label>
                <ul id="manageAppsList" class="manage-list">
                    <!-- Manage apps list will be loaded here by script.js -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Firebase and Main Script -->
    <!-- type="module" is mandatory for Firebase CDN to work properly -->
    <script type="module" src="script.js"></script>
    
</body>
</html>
