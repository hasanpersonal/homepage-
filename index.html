<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Right Edit Button -->
    <button id="editBtn" class="edit-btn"><i class="fas fa-cog"></i></button>

    <div class="main-container">
        <!-- Header Text -->
        <h1 id="headerText" class="header-text">Welcome Back</h1>

        <!-- Google Search -->
        <form id="searchForm" class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search Google..." autocomplete="off">
        </form>

        <!-- Apps/Websites Grid -->
        <div id="appsGrid" class="apps-grid">
            <!-- Apps will be loaded here by JS -->
        </div>

        <!-- Anime Release Schedule -->
        <div class="anime-container glass-panel">
            <h2><i class="fas fa-tv"></i> Anime Releases (Today & Next 2 Days)</h2>
            <div id="animeList" class="anime-list">
                <p>Loading schedule...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Homepage by Hasan | Project 2026</p>
    </footer>

    <!-- Settings Modal (Hidden by default) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass-panel">
            <span id="closeModal" class="close">&times;</span>
            <h2>Settings</h2>
            
            <div class="settings-section">
                <label>Header Text:</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="editHeaderText" placeholder="Enter new header">
                    <button id="saveHeaderBtn" class="btn">Save</button>
                </div>
            </div>

            <div class="settings-section">
                <label>Add New Website:</label>
                <input type="text" id="newAppName" placeholder="Website Name (e.g., YouTube)">
                <input type="url" id="newAppUrl" placeholder="Website URL (e.g., https://youtube.com)">
                <button id="addAppBtn" class="btn">Add Website</button>
            </div>

            <div class="settings-section">
                <label>Manage Websites (Order & Delete):</label>
                <ul id="manageAppsList" class="manage-list">
                    <!-- Manage apps list will be loaded here -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Firebase Script as Module -->
    <script type="module" src="script.js"></script>
</body>
</html>
