<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060914">
    <title>Hasan | Homepage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

    <button id="editBtn" class="edit-btn" title="Settings" aria-label="Open settings"><i class="fas fa-cog"></i></button>

    <main class="main-container">
        <header class="hero">
            <h1 id="headerText" class="header-text" data-text="Welcome Back">Welcome Back</h1>
            <div class="ornament" aria-hidden="true"><span></span><em></em><span></span></div>
        </header>

        <form id="searchForm" class="search-container" action="https://www.google.com/search" method="get">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" name="q" placeholder="Search Google..." autocomplete="off" aria-label="Search Google">
            <kbd title="Press / to search">/</kbd>
        </form>

        <section id="appsGrid" class="apps-grid" aria-label="Your websites"></section>

        <section class="drive-panel glass-panel">
            <div class="panel-head">
                <h2><i class="fab fa-google-drive"></i> Google Drive</h2>
                <div class="panel-actions">
                    <button id="driveRefresh" class="icon-btn" title="Refresh" aria-label="Refresh files" hidden><i class="fas fa-rotate"></i></button>
                    <button id="driveSignOut" class="icon-btn" title="Disconnect" aria-label="Disconnect Google Drive" hidden><i class="fas fa-link-slash"></i></button>
                </div>
            </div>
            <div id="driveList" class="drive-list"></div>
        </section>
    </main>

    <footer><p>Homepage by Hasan | Project 2026</p></footer>

    <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="modal-content glass-panel">
            <button id="closeModal" class="close" aria-label="Close settings">&times;</button>
            <h2 id="settingsTitle"><i class="fas fa-sliders-h"></i> Settings</h2>

            <div class="settings-section">
                <label for="editHeaderText">Header text</label>
                <div class="row">
                    <input type="text" id="editHeaderText" placeholder="Enter new header" maxlength="40">
                    <button id="saveHeaderBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                </div>
            </div>

            <div class="settings-section">
                <label for="newAppName">Add a website</label>
                <input type="text" id="newAppName" placeholder="Name (e.g., YouTube)" maxlength="30">
                <input type="text" id="newAppUrl" inputmode="url" placeholder="URL (e.g., youtube.com)" aria-label="Website URL">
                <button id="addAppBtn" class="btn"><i class="fas fa-plus"></i> Add website</button>
            </div>

            <div class="settings-section">
                <label for="driveFolderInput">Drive folder for notes (optional)</label>
                <div class="row">
                    <input type="text" id="driveFolderInput" placeholder="Folder link or ID (empty = recent files)">
                    <button id="saveFolderBtn" class="btn"><i class="fas fa-save"></i> Save</button>
                </div>
            </div>

            <div class="settings-section">
                <span class="label">Reorder or delete websites</span>
                <ul id="manageAppsList" class="manage-list"></ul>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="script.js"></script>
</body>
</html>
